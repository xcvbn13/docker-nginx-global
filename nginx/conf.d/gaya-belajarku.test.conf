server {
  listen 80;
  server_name gaya-belajarku.test;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name gaya-belajarku.test;

  ssl_certificate /etc/nginx/certs/gaya-belajarku.test.pem;
  ssl_certificate_key /etc/nginx/certs/gaya-belajarku.test-key.pem;

  client_max_body_size 50M;

  # Forward all requests as HTTP to service/container bk_nginx:80
  location / {
    proxy_pass http://bk_nginx:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_request_buffering off;
    proxy_buffering off;
  }
}
